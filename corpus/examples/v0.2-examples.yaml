policy:
  role: 公开正式文稿仅用于结构观察、边界分析和行为测试，不作为全国强制规范来源。
  redistribution: 原始PDF许可状态不明，保存在Git忽略目录；仓库仅提交元数据和原创分析。
  privacy: 示例中的个人电话、邮箱和联系人不得复制到测试输入或生成模板。

