schema_version: 1
source_id: SOURCE-002
rules:
  - id: FORMAT-ZONES-001
    title: 公文格式区域划分
    level: mandatory
    locator: 第7.1条
    requirements:
      - 版心内格式要素划分为版头、主体、版记三部分。
      - 首页红色分隔线以上为版头。
      - 首页红色分隔线以下至末页首条分隔线以上为主体，两条分隔线均不计入主体。
      - 末页首条分隔线以下至末条分隔线以上为版记。
      - 页码位于版心外。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-COPY-NUMBER-001
    title: 份号编排
    level: conditional
    locator: 第7.2.1条
    conditions:
      - 需要标注份号
    requirements:
      - 一般使用6位3号阿拉伯数字。
      - 顶格编排在版心左上角第一行。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-CLASSIFICATION-001
    title: 密级和保密期限编排
    level: conditional
    locator: 第7.2.2条
    conditions:
      - 需要标注密级和保密期限
    requirements:
      - 一般使用3号黑体字。
      - 顶格编排在版心左上角第二行。
      - 保密期限中的数字使用阿拉伯数字。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-URGENCY-001
    title: 紧急程度编排
    level: conditional
    locator: 第7.2.3条
    conditions:
      - 需要标注紧急程度
    requirements:
      - 一般使用3号黑体字。
      - 顶格编排在版心左上角。
      - 同时标注份号、密级和保密期限、紧急程度时，按该顺序自上而下分行排列。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-ORG-MARK-001
    title: 发文机关标志组成和编排
    level: mandatory
    locator: 第7.2.4条
    requirements:
      - 发文机关标志由机关全称或者规范化简称加“文件”二字组成，也可以只使用机关全称或者规范化简称。
      - 发文机关标志居中排布。
      - 上边缘至版心上边缘为35毫米。
      - 推荐使用小标宋体字和红色。
      - 编排以醒目、美观、庄重为原则。
      - 联合行文同时标注联署机关名称时，一般将主办机关名称排列在前。
      - 联合行文使用“文件”二字时，应置于机关名称右侧，并以联署机关名称为准上下居中。
    validation:
      mode:
        - deterministic
        - context_required
        - human_review
    review:
      status: extracted

  - id: FORMAT-DOC-NUMBER-001
    title: 发文字号编排
    level: mandatory
    locator: 第7.2.5条
    requirements:
      - 编排在发文机关标志下空二行位置并居中。
      - 年份和发文顺序号使用阿拉伯数字。
      - 年份标全称并使用六角括号括入。
      - 发文顺序号不加“第”字、不编虚位，数字后加“号”字。
      - 上行文发文字号居左空一字，与最后一个签发人姓名处在同一行。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-SIGNER-001
    title: 签发人编排
    level: conditional
    locator: 第7.2.6条
    conditions:
      - 公文需要标注签发人
    requirements:
      - 由“签发人”三字、全角冒号和签发人姓名组成。
      - 居右空一字，编排在发文机关标志下空二行位置。
      - “签发人”三字使用3号仿宋体字，姓名使用3号楷体字。
      - 多个签发人按发文机关排列顺序从左到右、自上而下均匀编排。
      - 多个签发人一般每行两个姓名，回行与上一行第一个姓名对齐。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-HEADER-LINE-001
    title: 版头分隔线
    level: mandatory
    locator: 第7.2.7条
    requirements:
      - 在发文字号之下4毫米处居中印制与版心等宽的红色分隔线。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-TITLE-LAYOUT-001
    title: 标题版式
    level: conditional
    locator: 第7.3.1条
    requirements:
      - 标题一般使用2号小标宋体字。
      - 编排于红色分隔线下空二行位置。
      - 一行或多行居中排布。
      - 回行应保持词意完整、排列对称、长短适宜、间距恰当。
      - 标题排列使用梯形或者菱形。
    validation:
      mode:
        - deterministic
        - human_review
    review:
      status: extracted

  - id: FORMAT-ADDRESSEE-LAYOUT-001
    title: 主送机关版式
    level: conditional
    locator: 第7.3.2条
    conditions:
      - 公文具有主送机关
    requirements:
      - 编排于标题下空一行位置，居左顶格，回行仍顶格。
      - 最后一个机关名称后使用全角冒号。
      - 主送机关过多导致首页不能显示正文时，移至版记并按第7.4.2条编排。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-BODY-001
    title: 正文版式
    level: mandatory
    locator: 第7.3.3条
    requirements:
      - 公文首页必须显示正文。
      - 正文一般使用3号仿宋体字。
      - 编排于主送机关名称下一行。
      - 每个自然段左空二字，回行顶格。
      - 结构层次序数依次可以使用“一、”“（一）”“1.”“（1）”。
      - 第一层一般使用黑体字，第二层一般使用楷体字，第三层和第四层一般使用仿宋体字。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-ATTACHMENT-NOTE-001
    title: 附件说明版式
    level: conditional
    locator: 第7.3.4条
    conditions:
      - 公文具有附件
    requirements:
      - 在正文下空一行左空二字编排“附件”二字。
      - “附件”后使用全角冒号和附件名称。
      - 多个附件使用阿拉伯数字标注顺序号。
      - 附件名称后不加标点符号。
      - 附件名称回行时与上一行附件名称首字对齐。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-SEAL-001
    title: 加盖印章公文的署名和日期
    level: conditional
    locator: 第7.3.5.1条
    conditions:
      - 公文加盖机关印章
    requirements:
      - 成文日期一般右空四字编排。
      - 印章使用红色，不得出现空白印章。
      - 单一机关行文时，机关署名一般位于成文日期之上，并以成文日期为准居中。
      - 单一机关印章端正、居中下压机关署名和成文日期，使二者位于印章中心偏下。
      - 印章顶端距正文或者附件说明一行之内。
      - 联合行文机关署名按发文机关顺序整齐排列，印章与署名一一对应。
      - 联合行文最后一个印章下压机关署名和成文日期。
      - 联合行文印章排列整齐、互不相交或相切，每排两端不超出版心。
    validation:
      mode:
        - deterministic
        - human_review
    review:
      status: extracted

  - id: FORMAT-NO-SEAL-001
    title: 不加盖印章公文的署名和日期
    level: conditional
    locator: 第7.3.5.2条
    conditions:
      - 公文不加盖机关印章
    requirements:
      - 单一机关署名在正文或者附件说明下空一行右空二字编排。
      - 成文日期在机关署名下一行编排，首字比机关署名首字右移二字。
      - 成文日期长于机关署名时，成文日期右空二字，并相应增加署名右空字数。
      - 联合行文先编排主办机关署名，其余机关署名依次向下编排。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-SIGNATURE-SEAL-001
    title: 签发人签名章公文的编排
    level: conditional
    locator: 第7.3.5.3条
    conditions:
      - 公文加盖签发人签名章
    requirements:
      - 单一机关在正文或者附件说明下空二行右空四字加盖签名章。
      - 签名章左空二字标注签发人职务，并以签名章为准上下居中。
      - 在签名章下空一行右空四字编排成文日期。
      - 联合行文先编排主办机关签发人职务和签名章，其余机关依次向下编排并上下对齐。
      - 联合行文每行只编排一个机关的签发人职务和签名章。
      - 签发人职务标注全称。
      - 签名章一般使用红色。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-DATE-001
    title: 成文日期数字格式
    level: mandatory
    locator: 第7.3.5.4条
    requirements:
      - 年、月、日使用阿拉伯数字并标全。
      - 年份标全称。
      - 月、日不编虚位。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-SEAL-SPACE-001
    title: 印章空间不足处理
    level: conditional
    locator: 第7.3.5.5条
    conditions:
      - 排版后的空白处不能容纳印章、签名章或者成文日期
    requirements:
      - 可以通过调整行距、字距解决。
    validation:
      mode:
        - deterministic
        - human_review
    review:
      status: extracted

  - id: FORMAT-NOTE-001
    title: 附注版式
    level: conditional
    locator: 第7.3.6条
    conditions:
      - 公文具有附注
    requirements:
      - 在成文日期下一行居左空二字使用圆括号编排。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-ATTACHMENT-001
    title: 附件编排
    level: conditional
    locator: 第7.3.7条
    conditions:
      - 公文具有附件
    requirements:
      - 附件另面编排，位于版记之前，并与正文一起装订。
      - “附件”二字及顺序号使用3号黑体字，顶格编排在版心左上角第一行。
      - 附件标题居中编排在版心第三行。
      - 附件顺序号和标题与附件说明一致。
      - 附件格式要求与正文相同。
      - 附件不能与正文一起装订时，在附件左上角第一行顶格编排发文字号，随后标注“附件”及顺序号。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-IMPRINT-LINES-001
    title: 版记分隔线
    level: mandatory
    locator: 第7.4.1条
    requirements:
      - 版记分隔线与版心等宽。
      - 首条和末条使用粗线，推荐高度0.35毫米。
      - 中间使用细线，推荐高度0.25毫米。
      - 首条位于版记第一个要素之上。
      - 末条与公文最后一面的版心下边缘重合。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-CC-001
    title: 抄送机关和移入版记的主送机关
    level: conditional
    locator: 第7.4.2条
    requirements:
      - 抄送机关一般使用4号仿宋体字。
      - 编排在印发机关和印发日期之上一行，左右各空一字。
      - “抄送”后使用全角冒号和机关名称。
      - 回行与冒号后的首字对齐，最后一个机关名称后标句号。
      - 主送机关移至版记时，将“抄送”改为“主送”，其余编排相同。
      - 主送和抄送同时存在时，主送置于抄送之上一行，二者之间不加分隔线。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted

  - id: FORMAT-PRINT-OFFICE-DATE-001
    title: 印发机关和印发日期
    level: mandatory
    locator: 第7.4.3条
    requirements:
      - 一般使用4号仿宋体字。
      - 编排在末条分隔线之上。
      - 印发机关左空一字，印发日期右空一字。
      - 日期使用阿拉伯数字，年月日标全，年份用全称，月日不编虚位。
      - 日期后加“印发”二字。
      - 版记还有其他要素时，以细分隔线与印发机关和印发日期隔开。
    validation:
      mode:
        - deterministic
    review:
      status: extracted

  - id: FORMAT-PAGE-NUMBER-001
    title: 页码版式
    level: conditional
    locator: 第7.5条
    requirements:
      - 页码一般使用4号半角宋体阿拉伯数字。
      - 编排在版心下边缘之下，数字左右各放一条一字线。
      - 一字线上距版心下边缘7毫米。
      - 单页码居右空一字，双页码居左空一字。
      - 版记页前有空白页时，空白页和版记页均不编排页码。
      - 附件与正文一起装订时，页码连续编排。
    validation:
      mode:
        - deterministic
        - context_required
    review:
      status: extracted
