schema_version: 1
rules:
  - id: ROUTING-GENERAL-001
    title: 行文必要性
    level: mandatory
    applies_to:
      document_types:
        - "*"
    requirement: 行文应当确有必要，讲求实效，注重针对性和可操作性。
    validation:
      mode:
        - semantic
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十三条
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-GENERAL-002
    title: 行文关系依据
    level: mandatory
    applies_to:
      document_types:
        - "*"
    requirement: 行文关系应当根据隶属关系和职权范围确定。
    validation:
      mode:
        - context_required
        - human_review
      required_context:
        - 发文机关
        - 受文机关
        - 组织隶属关系
        - 事项所属职权范围
    source_refs:
      - source_id: SOURCE-001
        locator: 第十四条
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-GENERAL-003
    title: 原则上不得越级行文
    level: conditional
    conditions:
      - 存在跨越直接隶属层级的行文
    requirement: 一般不得越级行文；特殊情况确需越级行文时，应当同时抄送被越过的机关。
    validation:
      mode:
        - context_required
        - human_review
      required_context:
        - 完整组织隶属关系
        - 越级原因
        - 抄送范围
    source_refs:
      - source_id: SOURCE-001
        locator: 第十四条
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-UPWARD-001
    title: 上行文主送机关
    level: mandatory
    applies_to:
      direction: upward
    requirement: 向上级机关行文原则上主送一个上级机关；根据需要可以抄送相关上级机关和同级机关，不抄送下级机关。
    validation:
      mode:
        - deterministic
        - context_required
      required_context:
        - 主送机关列表
        - 抄送机关列表
        - 各机关与发文机关的关系
    source_refs:
      - source_id: SOURCE-001
        locator: 第十五条第一项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-UPWARD-002
    title: 部门请示报告重大事项的授权要求
    level: conditional
    conditions:
      - 发文主体为党委或者政府的部门
      - 向上级主管部门请示或者报告重大事项
    requirement: 应当取得本级党委、政府同意或者授权；属于部门职权范围内的事项应当直接报送上级主管部门。
    validation:
      mode:
        - context_required
        - human_review
      required_context:
        - 事项是否重大
        - 事项是否属于部门职权范围
        - 是否已取得同意或者授权
    source_refs:
      - source_id: SOURCE-001
        locator: 第十五条第二项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-UPWARD-003
    title: 不直接向上级机关负责人报送
    level: conditional
    conditions:
      - 向上级机关行文
    requirement: 除上级机关负责人直接交办事项外，不得以本机关名义向上级机关负责人报送公文，也不得以本机关负责人名义向上级机关报送公文。
    validation:
      mode:
        - context_required
      required_context:
        - 主送对象
        - 发文名义
        - 是否属于直接交办事项
    source_refs:
      - source_id: SOURCE-001
        locator: 第十五条第五项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-UPWARD-004
    title: 双重领导机关上行文抄送
    level: conditional
    conditions:
      - 发文机关受双重领导
      - 向其中一个上级机关行文
    requirement: 必要时抄送另一个上级机关。
    validation:
      mode:
        - context_required
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十五条第六项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-DOWNWARD-001
    title: 下行文主送与抄送
    level: conditional
    conditions:
      - 向下级机关行文
    requirement: 主送受理机关，根据需要抄送相关机关；重要行文应当同时抄送发文机关的直接上级机关。
    validation:
      mode:
        - context_required
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十六条第一项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-DOWNWARD-002
    title: 部门不得擅自向下级党委政府提出指令性要求
    level: conditional
    conditions:
      - 发文主体为党委、政府的部门或者其他单位
      - 受文对象为下级党委、政府
    requirement: 除办公厅（室）根据本级党委、政府授权外，不得向下级党委、政府发布指令性公文或者提出指令性要求；经政府同意由职能部门行文的，文中应注明已经政府同意。
    validation:
      mode:
        - context_required
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十六条第二项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-DOWNWARD-003
    title: 部门在职权范围内向下级相关部门行文
    level: conditional
    conditions:
      - 发文主体为党委、政府的部门
      - 受文对象为下级党委、政府的相关部门
    requirement: 行文事项应当属于发文部门职权范围。
    validation:
      mode:
        - context_required
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十六条第三项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-DOWNWARD-004
    title: 多部门职权事项协商一致
    level: conditional
    conditions:
      - 行文涉及多个部门职权范围
    requirement: 部门之间未协商一致的，不得向下行文。
    validation:
      mode:
        - context_required
        - human_review
      required_context:
        - 涉及部门
        - 协商和会签情况
    source_refs:
      - source_id: SOURCE-001
        locator: 第十六条第四项
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-JOINT-001
    title: 联合行文范围
    level: conditional
    conditions:
      - 两个以上机关拟联合行文
    requirement: 同级党政机关、党政机关与其他同级机关在必要时可以联合行文；属于党委、政府各自职权范围内的工作不得联合行文；党委、政府的部门依据职权可以相互行文。
    validation:
      mode:
        - context_required
        - human_review
    source_refs:
      - source_id: SOURCE-001
        locator: 第十七条第一款、第二款
    review:
      status: active
      reviewed_at: "2026-10-17"

  - id: ROUTING-AUTHORITY-001
    title: 部门内设机构对外行文限制
    level: mandatory
    requirement: 部门内设机构除办公厅（室）外不得对外正式行文。
    validation:
      mode:
        - context_required
      required_context:
        - 发文主体的组织性质
    source_refs:
      - source_id: SOURCE-001
        locator: 第十七条第三款
    review:
      status: active
      reviewed_at: "2026-10-17"
