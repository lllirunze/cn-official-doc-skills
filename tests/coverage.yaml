acceptance:
  - 每个required_rule_id至少被一个行为样例引用
  - 每个样例引用的规则编号真实存在
  - 正例、反例和依赖上下文的边界例均有覆盖
  - 测试验证可观察行为，不匹配固定措辞
  - 项目维护者完成人工签核
