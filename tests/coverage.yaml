schema_version: 1
release: v0.1.0
status: human_approved
human_approval: approved
human_approved_at: "2026-10-17"

policy:
  behavior_test_required: 直接影响通知、报告、请示起草与审核结果的规则
  source_check_only:
    - 条例总则、组织保障、收发办理、归档、保密管理、机构变动和附则
    - 物理纸张、印刷和装订生产指标
    - v0.1.0不支持的信函、命令（令）、纪要和横排表格特定格式
    - 竖排文本及出版物专用的低频标点数字规则
  duplicate_coverage_records: REG-ARTICLE系列用于证明条例条款完整覆盖，不重复要求每条建立Skill行为样例。

